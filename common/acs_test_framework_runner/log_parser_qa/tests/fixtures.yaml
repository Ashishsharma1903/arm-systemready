      pcie_option_rom_arch_audit.json:
        destination: "Suite_Name: Standalone"
        assertions:
          - {path: [suite_summary, total_passed], value: 1}
          - {path: [suite_summary, total_failed], value: 0}
          - {path: [suite_summary, total_skipped], value: 0}
