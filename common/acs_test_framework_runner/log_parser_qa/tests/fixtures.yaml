# Handwritten format fixtures. Names and diagnostics are synthetic, not device logs.
# Exact expectations are derived from the input lines, independently of the parser.
outcomes:
  - {name: mandatory_pass, suite: FWTS, status: passed, passed: 2, failed: 0, waived: 0, compliance: Compliant}
  - {name: mandatory_fail, suite: FWTS, status: failed, passed: 1, failed: 1, waived: 0, compliance: "Not Compliant: Failed 1"}
  - {name: mandatory_waiver, suite: FWTS, status: waived, passed: 1, failed: 0, waived: 1, compliance: "Compliant with waivers: Waivers 1"}
  - {name: sct_waiver, suite: SCT, status: waived, passed: 1, failed: 0, waived: 1, compliance: "Compliant with waivers: Waivers 1"}
  - {name: nested_bsa_waiver, suite: BSA, status: waived, passed: 1, failed: 0, waived: 1, compliance: "Compliant with waivers: Waivers 1"}
scenarios:
  - name: sr_all_report_families
    mode: SR
    suites: [BSA, SBSA, FWTS, SCT, BBSR-FWTS, BBSR-SCT, BBSR-TPM, SBMR-IB, SBMR-OOB, OS-TESTS]
    files:
      results/uefi/BsaResults.log: &bsa |
        *** Running PE tests ***
        B_PE_01 : 1 : QA passing rule
        Result: PASSED
        B_PE_02 : 2 : QA failing rule
        === Start tests for rules referenced by B_PE_02 ===
        B_CHILD_01 : 3 : QA failing child rule
        Result: FAILED
        === End tests for rules referenced by B_PE_02 ===
        Result: FAILED
      results/uefi/SbsaResults.log: *bsa
      results/fwts/FWTSResults.log: &fwts |
        Running tests: uefirtmisc
        ====================
        uefirtmisc: QA interface checks
        Test 1 of 2: QA passing interface
        PASSED: Test 1, QA passed
        Test 2 of 2: QA failing interface
        FAILED [HIGH] QA failed
      results/bbsr/fwts/FWTSResults.log: |
        Running tests: RuntimeServicesTest
        ====================
        RuntimeServicesTest: QA interface checks
        Test 1 of 2: QA passing interface
        PASSED: Test 1, QA passed
        Test 2 of 2: QA failing interface
        FAILED [HIGH] QA failed
      results/sct_results/Overall/Summary.log: &sct |
        BBR ACS 2.1
        ResetSystem_Func
        Test Configuration #0
        QA event checks
        Test Entry Point GUID: 29481844-C567-4A8D-B92F-D57B32F039B8
        Returned Status Code: 0
        ResetSystem_Func: [FAILURE]
        QA passing event -- PASS
        4E9AA877-2672-4F8C-BA3C-C02F49A68911
        /build/edk2-test/SctPkg/TestCase/UEFI/EFI/BootServices/Test.c:10:Status - Success
        QA failing event -- FAIL
        060234F5-A84A-4DD7-AD5B-64996250F216
        /build/edk2-test/SctPkg/TestCase/UEFI/EFI/BootServices/Test.c:20:Status - Device Error
      results/bbsr/sct_results/Overall/Summary.log: *sct
      results/edk2-test-parser/edk2-test-parser.log: &edk2 |
        | name | set guid | guid | result | updated by |
        |------|----------|------|--------|------------|
        | QA failing event | 29481844-C567-4A8D-B92F-D57B32F039B8 | 060234F5-A84A-4DD7-AD5B-64996250F216 | FAIL | QA helper reason |
      results/edk2-test-parser/edk2-test-parser-bbsr.log: *edk2
      results/bbsr/tpm2/verify_tpm_measurements.log: |
        Verify QA digest: PASS
        Verify QA event: FAIL
          QA digest does not match
      results/sbmr/sbmr_in_band_logs/output.xml: &sbmr |
        <robot><suite name="SBMR"><suite name="Discovery"><suite name="QA checks">
        <test name="QA passing command"><status status="PASS"/></test>
        <test name="QA failing command"><status status="FAIL">QA command failed</status></test>
        </suite></suite></suite></robot>
      results/sbmr/sbmr_out_of_band_logs/output.xml: *sbmr
      results/post-script/post-script.log: |
        INFO QA checks started
        ERROR QA required file is missing
        WARNING QA optional file is missing
      os-logs/rhel/cat-etc-os-release.txt: |
        NAME="Red Hat Enterprise Linux"
        VERSION_ID="9.3"
      os-logs/sle/cat-etc-os-release.txt: |
        NAME="SLES"
        VERSION_ID="15"
    auxiliary: [edk2_test_parser.json, edk2_test_parser-bbsr.json]
    raw:
      bsa.json:
        destination: "Suite_Name: BSA"
        assertions: &bsa_checks
          - {path: [suite_summary, Passed], value: 1}
          - {path: [suite_summary, Failed], value: 1}
          - {path: [suite_summary, Total Rules Run], value: 2}
        records: &bsa_records
          - path: [test_results, 0, testcases, 0]
            fields: {Test_case: "B_PE_01 : 1", Test_case_description: QA passing rule, Test_result: PASSED}
          - path: [test_results, 0, testcases, 1]
            fields: {Test_case: "B_PE_02 : 2", Test_case_description: QA failing rule, Test_result: FAILED}
          - path: [test_results, 0, testcases, 1, subtests, 0]
            fields: {sub_Test_Number: "B_CHILD_01 : 3", sub_Test_Description: QA failing child rule, sub_test_result: FAILED}
      sbsa.json:
        destination: "Suite_Name: SBSA"
        assertions: *bsa_checks
        records: *bsa_records
      fwts.json:
        destination: "Suite_Name: SBBR-FWTS"
        assertions: &basic_checks
          - {path: [suite_summary, total_passed], value: 1}
          - {path: [suite_summary, total_failed], value: 1}
        records: &fwts_records
          - path: [test_results, 0, subtests, 0]
            fields:
              sub_Test_Number: "1 of 2"
              sub_Test_Description: QA passing interface
              sub_test_result: &passed {PASSED: 1, FAILED: 0, SKIPPED: 0, ABORTED: 0, WARNINGS: 0}
          - path: [test_results, 0, subtests, 1]
            fields:
              sub_Test_Number: "2 of 2"
              sub_Test_Description: QA failing interface
              sub_test_result: &failed {PASSED: 0, FAILED: 1, SKIPPED: 0, ABORTED: 0, WARNINGS: 0}
      bbsr_fwts.json:
        destination: "Suite_Name: BBSR-FWTS"
        assertions: *basic_checks
        records: *fwts_records
      sct.json:
        destination: "Suite_Name: SBBR-SCT"
        assertions: *basic_checks
        records: &sct_records
          - path: [test_results, 0, subtests, 0]
            fields: {sub_Test_Number: "1", sub_Test_GUID: 4E9AA877-2672-4F8C-BA3C-C02F49A68911, sub_Test_Description: QA passing event, sub_test_result: PASSED}
          - path: [test_results, 0, subtests, 1]
            fields: {sub_Test_Number: "2", sub_Test_GUID: 060234F5-A84A-4DD7-AD5B-64996250F216, sub_Test_Description: QA failing event, sub_test_result: FAILED}
      bbsr_sct.json:
        destination: "Suite_Name: BBSR-SCT"
        assertions: *basic_checks
        records: *sct_records
      bbsr_tpm.json:
        destination: "Suite_Name: BBSR-TPM"
        assertions: *basic_checks
        records: &tpm_records
          - path: [test_results, 0, subtests, 0]
            fields: {sub_Test_Number: "1", sub_Test_Description: Verify QA digest, sub_test_result: PASS}
          - path: [test_results, 0, subtests, 1]
            fields: {sub_Test_Number: "2", sub_Test_Description: Verify QA event, sub_test_result: FAIL}
      sbmr_ib.json:
        destination: "Suite_Name: SBMR-IB"
        assertions: *basic_checks
        records: &sbmr_records
          - path: [test_results, 0, Test_cases, 0, subtests, 0]
            fields: {sub_Test_Number: "1", sub_Test_Description: QA passing command, sub_test_result: PASSED}
          - path: [test_results, 0, Test_cases, 0, subtests, 1]
            fields: {sub_Test_Number: "2", sub_Test_Description: QA failing command, sub_test_result: FAILED}
      sbmr_oob.json:
        destination: "Suite_Name: SBMR-OOB"
        assertions: *basic_checks
        records: *sbmr_records
      os_test.json:
        destination: "Suite_Name: OS Tests"
        assertions:
          - {path: [test_results, 0, Test_suite], value: "os_test"}
          - {path: [suite_summary, total_passed], value: 2}
          - {path: [suite_summary, total_failed], value: 0}
          - {path: [test_results, 0, subtests, 0, sub_test_result, pass_reasons], value: [Red Hat Enterprise Linux 9.3]}
          - {path: [test_results, 0, subtests, 1, sub_test_result, pass_reasons], value: [SLES 15]}
        records:
          - path: [test_results, 0, subtests, 0]
            fields: {sub_Test_Number: "1", sub_Test_Description: Is rhel logs present or not, sub_test_result: *passed}
          - path: [test_results, 0, subtests, 1]
            fields: {sub_Test_Number: "2", sub_Test_Description: Is sle logs present or not, sub_test_result: *passed}

  - name: dt_all_standalone_routes
    mode: DT
    suites: [BSA, FWTS, SCT, BBSR-FWTS, BBSR-SCT, BBSR-TPM, PFDI, SCMI, POST-SCRIPT, DT-KSELFTEST, DT-VALIDATE, ETHTOOL-TEST, READ-WRITE-CHECK-BLK-DEVICES, CAPSULE-UPDATE, PSCI, SMBIOS, NETWORK-BOOT, RUNTIME-DEV-MAP, OS-TESTS]
