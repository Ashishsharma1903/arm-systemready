  - name: dt_memory_and_spin_routes
    mode: DT
    suites: [RESERVED-MEMORY-MAP, DTB-ALIGNMENT, SPIN-TABLE-CHECK]
    overall: Compliant
    files:
      results/linux_tools/reserved_memory_map_test.log: |
        Testing Devicetree Reserved Memory Map Compliance Test
