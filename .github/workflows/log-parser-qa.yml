name: Log-parser QA

on:
  pull_request:
    paths:
      - 'common/log_parser/**'
  push:
    paths:
      - 'common/log_parser/**'

permissions:
  contents: read

concurrency:
  group: log-parser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parser-qa:
    name: Parser QA (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: common/acs_test_framework_runner/requirements-qa.txt

      - name: Install QA dependencies
        id: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python -m pip install -r common/acs_test_framework_runner/requirements-qa.txt
          if ! command -v chromium; then
            chrome=$(command -v google-chrome || command -v google-chrome-stable)
            sudo ln -s "$chrome" /usr/local/bin/chromium
          fi
          chromium --version
          mkdir -p common/reports

      - name: Identify new suites, existing suites, and shared changes
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-parse origin/main)
          fi
          python common/acs_test_framework_runner/impact.py --base "$BASE_SHA" \
            | tee common/reports/change-impact.json

      - name: Verify the QA checks themselves
        id: selftests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          if python -m pytest -q --tb=short common/acs_test_framework_runner \
            --ignore=common/acs_test_framework_runner/tests/log_parser \
            --basetemp=common/reports/qa-selftests-work \
            --junitxml=common/reports/qa-selftests.xml \
            > common/reports/qa-selftests.log 2>&1; then
            echo 'The QA self-tests passed.'
          else
            tail -n 80 common/reports/qa-selftests.log
            exit 1
          fi

      - name: Compare all checks with the base revision
        id: regression
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.impact.outcome == 'success' }}
        run: |
          base=$(python -c 'import json; print(json.load(open("common/reports/change-impact.json"))["base"])')
          python common/acs_test_framework_runner/qa_run.py \
            --base "$base" --reports common/reports \
            > common/reports/regression.log 2>&1

      - name: Compare identical DT and SR inputs with the base parser
        id: replay
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.impact.outcome == 'success' }}
        run: |
          base=$(python -c 'import json; print(json.load(open("common/reports/change-impact.json"))["base"])')
          base_dir=$(mktemp -d "$RUNNER_TEMP/parser-qa-base.XXXXXX")
          git archive "$base" common/log_parser docs LICENSE.md | tar -x -C "$base_dir"
          python common/acs_test_framework_runner/parser_replay.py \
            --base-parser "$base_dir/common/log_parser" \
            --candidate-parser common/log_parser --output common/reports/replay \
            > common/reports/replay.log 2>&1

      - name: Summarize checks and verify JUnit reports
        if: ${{ always() }}
        env:
          SELFTEST_RESULT: ${{ steps.selftests.outcome }}
          REGRESSION_RESULT: ${{ steps.regression.outcome }}
          REPLAY_RESULT: ${{ steps.replay.outcome }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          IMPACT_RESULT: ${{ steps.impact.outcome }}
          GUIDE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/log_parser_pr_qa.md
        run: |
          python common/acs_test_framework_runner/qa_report.py \
            --reports common/reports \
            --summary "$GITHUB_STEP_SUMMARY" \
            --findings common/reports/qa-findings.json --baseline-aware

      - name: Upload test reports and full logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: log-parser-qa-python-${{ matrix.python-version }}
          path: common/reports/
          if-no-files-found: error
          retention-days: 14
