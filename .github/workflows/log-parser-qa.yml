name: TEST ONLY Log-parser YAML Diagnostic

on:
  push:
    branches:
      - log-parser-pr-qa-yaml-diagnostic
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-yaml-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml-diagnostic:
    name: TEST ONLY Python 3.10 YAML
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: common/acs_test_framework_runner/requirements-qa.txt

      - name: Install QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python -m pip install -r common/acs_test_framework_runner/requirements-qa.txt
          command -v chromium
          chromium --version
          mkdir -p common/reports

      - name: Run YAML diagnostics, stop immediately on the first failure
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET

          def annotation(level, message):
              escaped = str(message).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::{level}::{escaped}', flush=True)

          for iteration in range(1, 4):
              reports = Path('common/reports') / f'iteration-{iteration}'
              reports.mkdir(parents=True)
              log = reports / 'yaml-suite.log'
              command = [
                  sys.executable, 'common/acs_test_framework_runner/pytest_runner.py',
                  '--all-tests', '--target', 'common/log_parser', '--require-tests',
                  '--fail-on-warnings', '--fail-on-skips', '--jobs', '4',
                  '--reports-dir', str(reports),
              ]
              started = time.monotonic()
              with log.open('w', encoding='utf-8') as output:
                  result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, check=False)
              elapsed = time.monotonic() - started
              failures = []
              count = 0
              for report in sorted(reports.glob('*.xml')):
                  try:
                      cases = list(ET.parse(report).iter('testcase'))
                  except (ET.ParseError, OSError) as error:
                      failures.append(f'{report.name}: unreadable JUnit: {error}')
                      continue
                  count += len(cases)
                  for case in cases:
                      for tag in ('failure', 'error', 'skipped'):
                          problem = case.find(tag)
                          if problem is not None:
                              detail = problem.get('message') or problem.text or tag
                              failures.append(f"{report.name}: {case.get('name')}: {tag}: {detail}")
              if result.returncode or failures or not count:
                  for failure in failures:
                      annotation('error', f'Iteration {iteration}: {failure}')
                  if not failures:
                      annotation('error', f'Iteration {iteration}: runner exit {result.returncode}, {count} JUnit cases')
                      print('\n'.join(log.read_text(encoding='utf-8').splitlines()[-80:]), flush=True)
                  annotation('error', f'Iteration {iteration} FAILED after {elapsed:.2f}s; no further iterations will run.')
                  raise SystemExit(1)
              message = f'Iteration {iteration}: PASS, {count} tests, {elapsed:.2f}s'
              annotation('notice', message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(message + '\n\n')
          PY

      - name: Upload diagnostic test reports and full logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TEST-ONLY-yaml-diagnostic-python-3.10
          path: common/reports/
          if-no-files-found: error
          retention-days: 7
