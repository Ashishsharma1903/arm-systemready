name: Log-parser QA

on:
  pull_request:
    paths:
      - 'common/log_parser/**'
      - 'common/acs_test_framework_runner/**'
      - 'common/acs_test_framework_manifests/**'
      - '.github/workflows/log-parser-qa.yml'
  push:
    paths:
      - 'common/log_parser/**'
      - 'common/acs_test_framework_runner/**'
      - 'common/acs_test_framework_manifests/**'
      - '.github/workflows/log-parser-qa.yml'

permissions:
  contents: read

concurrency:
  group: log-parser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parser-qa:
    name: Parser QA (Python 3.12)
    runs-on: ubuntu-24.04
    # The comparison can use five 30-minute stage caps. Leave room for setup,
    # replay and evidence upload instead of cancelling a safe change at 60 min.
    timeout-minutes: 250
    defaults:
      run:
        shell: bash
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
    steps:
      - name: Check out the proposed change
        timeout-minutes: 5
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: common/acs_test_framework_runner/log_parser_qa/requirements-qa.txt

      - name: Install QA dependencies
        id: dependencies
        timeout-minutes: 15
        run: |
          mkdir -p common/reports
          exec > >(tee common/reports/dependencies.log) 2>&1
          # Hosted runners often have these libraries already. Avoid an apt
          # update when none are missing, and bound transient network retries.
          missing=()
          for package in libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0; do
            if [[ $(dpkg-query -W -f='${Status}' "$package" 2>/dev/null) != 'install ok installed' ]]; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update -qq
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 \
              install -y --no-install-recommends "${missing[@]}"
          fi
          python -m pip install --retries 3 --timeout 30 \
            -r common/acs_test_framework_runner/log_parser_qa/requirements-qa.txt
          if ! command -v chromium; then
            chrome=$(command -v google-chrome || command -v google-chrome-stable)
            sudo ln -s "$chrome" /usr/local/bin/chromium
          fi
          chromium --version

      - name: Identify new suites, existing suites, and shared changes
        id: impact
        timeout-minutes: 5
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p common/reports
          exec 2> >(tee common/reports/change-impact.stderr.log >&2)
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            # A new branch has no before SHA. Fetch main explicitly because
            # the shallow candidate checkout need not contain its remote ref.
            git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            BASE_SHA=$(git rev-parse --verify refs/remotes/origin/main^{commit})
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # Force-pushed old tips are fetched by exact SHA, never substituted.
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          python common/acs_test_framework_runner/log_parser_qa/qa_run.py --classify --base "$BASE_SHA" \
            | tee common/reports/change-impact.json

      - name: Verify the QA checks themselves
        id: selftests
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          # Check the CI machinery here; optional Doctor tests are separate.
          # Parser behavior is compared on both revisions in the next stage.
          if python -m pytest -q --tb=short \
            common/acs_test_framework_runner/log_parser_qa \
            common/acs_test_framework_runner/test_pytest_runner_selection.py \
            --ignore=common/acs_test_framework_runner/log_parser_qa/tests \
            --basetemp=common/reports/qa-selftests-work \
            --junitxml=common/reports/qa-selftests.xml \
            > common/reports/qa-selftests.log 2>&1; then
            echo 'The QA self-tests passed.'
          else
            tail -n 80 common/reports/qa-selftests.log
            exit 1
          fi

      - name: Compare all checks with the base revision
        id: regression
        timeout-minutes: 160
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.impact.outcome == 'success' }}
        run: |
          base=$(python -c 'import json; print(json.load(open("common/reports/change-impact.json"))["base"])')
          python common/acs_test_framework_runner/log_parser_qa/qa_run.py \
            --base "$base" --stage-timeout 1800 --reports common/reports \
            > common/reports/regression.log 2>&1

      - name: Compare identical DT and SR inputs with the base parser
        id: replay
        timeout-minutes: 20
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.impact.outcome == 'success' }}
        run: |
          base=$(python -c 'import json; print(json.load(open("common/reports/change-impact.json"))["base"])')
          base_dir=$(mktemp -d "$RUNNER_TEMP/parser-qa-base.XXXXXX")
          git archive "$base" common/log_parser docs LICENSE.md | tar -x -C "$base_dir"
          python common/acs_test_framework_runner/log_parser_qa/parser_replay.py \
            --base-parser "$base_dir/common/log_parser" \
            --candidate-parser common/log_parser --output common/reports/replay \
            > common/reports/replay.log 2>&1

      - name: Summarize checks and verify JUnit reports
        timeout-minutes: 5
        if: ${{ always() }}
        env:
          SELFTEST_RESULT: ${{ steps.selftests.outcome }}
          REGRESSION_RESULT: ${{ steps.regression.outcome }}
          REPLAY_RESULT: ${{ steps.replay.outcome }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          IMPACT_RESULT: ${{ steps.impact.outcome }}
          GUIDE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/log_parser_pr_qa.md
        run: |
          python common/acs_test_framework_runner/log_parser_qa/qa_report.py \
            --reports common/reports \
            --summary "$GITHUB_STEP_SUMMARY" \
            --findings common/reports/qa-findings.json --baseline-aware

      - name: Upload test reports and full logs
        timeout-minutes: 10
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: log-parser-qa-python-3.12
          path: common/reports/
          if-no-files-found: error
          retention-days: 14
